name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR title follows Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if printf '%s' "$TITLE" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9][a-z0-9._/-]*\))?!?: .+'; then
            echo "ok: $TITLE"
          else
            echo "::error::PR title must follow Conventional Commits, e.g. 'feat(map): add marker clustering'. Got: $TITLE"
            exit 1
          fi

  build:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Detect Node project
        id: detect
        run: |
          if [ -f package.json ]; then echo "node=true" >> "$GITHUB_OUTPUT"; else echo "node=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.node == 'true'
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.detect.outputs.node == 'true'
        run: |
          if [ -f pnpm-lock.yaml ]; then corepack enable && pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then corepack enable && yarn install --immutable
          elif [ -f package-lock.json ]; then npm ci
          else npm install
          fi

      - name: Lint
        if: steps.detect.outputs.node == 'true'
        run: npm run lint --if-present

      - name: Typecheck
        if: steps.detect.outputs.node == 'true'
        run: npm run typecheck --if-present

      - name: Test
        if: steps.detect.outputs.node == 'true'
        env:
          CI: true
        run: npm run test --if-present

      - name: Build
        if: steps.detect.outputs.node == 'true'
        run: npm run build --if-present

      - name: Nothing to build yet
        if: steps.detect.outputs.node != 'true'
        run: echo "No package.json yet, nothing to build."
