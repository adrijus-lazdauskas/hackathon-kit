name: hack-bot

# Relays human answers to blocked tasks and keeps the pinned board issue up to date.
on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, assigned, unassigned]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: hack-bot
  cancel-in-progress: false

jobs:
  board:
    name: Relay answers and refresh the board
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/hack
            hackathon.json
          sparse-checkout-cone-mode: false

      - name: Run hack-bot
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node .github/hack/hack-bot.mjs
